<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:oklch(0.981 0.008 80);
      --card:#ffffff;
      --ink:oklch(0.245 0.018 60);
      --ink2:oklch(0.545 0.014 60);
      --line:oklch(0.902 0.012 75);
      --accent:oklch(0.55 0.15 42);
      --accent-dark:oklch(0.45 0.15 42);
      --accent-soft:oklch(0.955 0.028 42);
      --ok:oklch(0.55 0.15 150);
      --ok-soft:oklch(0.955 0.028 150);
      --ph:oklch(0.935 0.013 75);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Figtree,'Segoe UI',system-ui,sans-serif;color:var(--ink);
         background:var(--paper);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
    h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;letter-spacing:-0.022em;line-height:1.15}
    a{color:oklch(0.55 0.15 42);text-decoration:none}
    a:hover{color:oklch(0.45 0.15 42)}
    .scr{width:390px;height:844px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
    .bar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);
         border-bottom:1px solid var(--line);flex-shrink:0}
    .bd{flex-grow:1;overflow:hidden;display:flex;flex-direction:column}
    .pad{padding:16px;display:flex;flex-direction:column;gap:14px}
    .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .ph{background:var(--ph);display:flex;align-items:center;justify-content:center;color:oklch(0.72 0.02 75)}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;
          border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;white-space:nowrap}
    .chip-on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;
         font-size:11px;font-weight:600;letter-spacing:.01em}
    .btn{height:52px;border-radius:12px;border:none;font-family:inherit;font-size:16px;font-weight:600;
         display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
    .btn-1{background:var(--accent);color:#fff}
    .btn-2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
    .fld{display:flex;flex-direction:column;gap:6px}
    .fld > span{font-size:13px;font-weight:600;color:var(--ink2)}
    .inp{height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card);
         display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px}
    .nav{display:flex;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
    .nav > div{flex-grow:1;height:64px;display:flex;flex-direction:column;align-items:center;
               justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink2)}
    .prc{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:700;letter-spacing:-0.01em}
    .mut{color:var(--ink2)}
  </style>
</helmet>
<div class="scr">
  <div class="bd">
    <div style="position:relative">
      <div class="ph" style="height:300px;border-radius:0;flex-direction:column"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg><div style="font-size:11px;font-weight:500;margin-top:6px">Photo 1 sur 3</div></div>
      <div style="position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:999px;
                  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
      </div>
      <div style="position:absolute;bottom:14px;left:0;right:0;display:flex;gap:5px;
                  align-items:center;justify-content:center"><span style="width:18px;height:6px;border-radius:999px;background:var(--ink)"></span><span style="width:6px;height:6px;border-radius:999px;background:oklch(0.82 0.01 75)"></span><span style="width:6px;height:6px;border-radius:999px;background:oklch(0.82 0.01 75)"></span></div>
    </div>

    <div class="pad" style="gap:12px">
      <div style="display:flex;flex-direction:column;gap:7px">
        <h2 style="font-size:21px;font-weight:700">Sac de riz importé 50 kg</h2>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="prc" style="font-size:26px">450 000 GNF</div>
          <span class="tag" style="background:var(--accent-soft);color:var(--accent-dark);padding:5px 10px;font-size:12px">Négociable</span>
        </div>
        <div style="display:flex;align-items:center;gap:5px;color:var(--ok);font-size:13px;font-weight:600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg>Disponible
        </div>
      </div>

      <p style="margin:0;font-size:14.5px;color:var(--ink2);line-height:1.55">
        Riz parfumé importé, sac de 50 kg. Qualité contrôlée. Retrait sur place au
        marché de Madina, livraison possible dans Conakry.
      </p>

      <div class="card" style="padding:14px;display:flex;align-items:center;gap:12px">
        <div class="ph" style="width:46px;height:46px;border-radius:999px;flex-shrink:0"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-4 9 4v8l-9 4-9-4V8Z"/><path d="M3 8l9 4 9-4"/><path d="M12 12v8"/></svg></div>
        <div style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
          <div style="font-size:15px;font-weight:600">Chez Aïssatou</div>
          <div class="mut" style="font-size:12.5px">Marché de Madina, allée 3 · Conakry</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <div style="display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h9l-1 3h6v9h-7l-1-3H5"/></svg>Signaler ce produit
      </div>
    </div>
  </div>

  <div style="padding:12px 16px 16px;background:var(--card);border-top:1px solid var(--line);
              display:flex;gap:10px;flex-shrink:0">
    <button class="btn btn-1" style="flex-grow:1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.2-4.2A8 8 0 1 1 21 12Z"/></svg>Contacter le vendeur</button>
    <button class="btn btn-2" style="width:52px;flex-shrink:0;color:var(--ok)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.7a8.7 8.7 0 0 1-13 7.6L3.5 21l1.8-4.3A8.7 8.7 0 1 1 21 11.7Z"/><path d="M8.8 9.4c0 3 2.4 5.4 5.4 5.4l1-1.2-1.7-1-.9.8a4.3 4.3 0 0 1-2.1-2.1l.8-.9-1-1.7-1.2 1c-.2 0-.3.1-.3.7Z"/></svg></button>
  </div>
</div></x-dc>
</body>
</html>
